# fanout roadmap - SINGLE SOURCE OF TRUTH for the watchtower.
# Edit this file to change status; the watchtower reads it live
# (python watchtower/server.py -> http://127.0.0.1:8768).
#
# Task schema:
#   id          P<phase>.<n>
#   title       short name
#   status      done | in_progress | pending | blocked
#   effort      1..5 story points (drives the % complete)
#   depends_on  list of task ids; unmet deps are shown as "blocked by"
#   why         plain-English reason it is pending/blocked, or what it needs
#   decision    id of an open decision (below) that gates the task (optional)
#   checks      automated proofs that a "done" claim is real (optional):
#                 {type: path, path: relative/file}
#                 {type: cmd,  run: "shell command"}   # exit 0 = pass, cwd = repo root
# Decision schema (open_decisions): id, title, why, blocks [task ids], default,
#   status  open | resolved | deferred   (resolved decisions block nothing)
#   outcome text recorded when resolved/deferred
# Feature schema (features): id, title, source (own), area, status
#   (shipped | building | planned | idea | wont), task, note
#
# Status semantics in the UI:
#   done + all checks pass  -> VERIFIED
#   done + a check fails    -> CLAIMED (something is wrong, look at it)
#   pending with unmet deps -> BLOCKED BY <deps>
#   blocked                 -> needs a human decision/action (see why/decision)
#
# The smoke test (npm run smoke) opens a real window, so it is not a check
# here: the watchtower re-runs checks often. Run it by hand after a change.

project: fanout
tagline: One window for every brand's social accounts - isolated sign-ins, tabs per brand, a file panel to drag uploads from
updated: 2026-11-17

open_decisions:
  - id: D1
    title: App shell
    status: resolved
    outcome: "Electron (owner chose it 2026-11-12) for Windows, macOS and Linux. Vanilla JS, no framework, no bundler, no runtime dependencies."
    why: Session partitions and embedded pages are most mature in Electron.
    blocks: []
    default: Electron
  - id: D2
    title: Automation
    status: resolved
    outcome: "None. fanout never clicks, types or reads inside a page; the owner posts by hand (owner's rule 2026-11-12, most platforms forbid bots). Revisit only if a platform allows it."
    why: LinkedIn, TikTok, Instagram and X forbid automated activity; a public tool must not risk its users' accounts.
    blocks: []
    default: no automation
  - id: D3
    title: Licence
    status: resolved
    outcome: "MIT, same as lemonaid (taken as the default; the owner said open source and named no licence - change LICENSE if another is wanted)."
    why: Open source under thedumbstuff.
    blocks: []
    default: MIT
  - id: D4
    title: Google sign-in inside fanout
    status: resolved
    outcome: "2026-11-16 (owner): signing in to Google (YouTube) inside fanout works. The cause of the refusal was the Chrome disguise 0.2.0 first shipped with; telling sites fanout's true user agent (Electron's own, unchanged) fixed it, confirmed by the owner's own sign-in. No fallback (system browser) needed. If Google ever refuses again: a decision, not another disguise."
    why: "2026-11-12: with the plain Chrome user agent (the disguise 0.2.0 shipped with), Google refused the owner's YouTube sign-in: 'Couldn't sign you in. This browser or app may not be secure.' Google's rules for accounts.google.com require a browser to identify itself in its user agent, forbid using another browser's (Chrome's), and forbid rewriting headers; other Electron apps fixed the same error by dropping their disguise. Changed: pages now get Electron's own user agent unchanged (fanout/0.2.0 Chrome/156 Electron/45.3.0), the same in headers and page JavaScript; Electron sends no Sec-CH-UA headers; a unit test forbids overrides. Stays open until the owner signs in. Google's rules also disallow sign-in from embedded frameworks, so it may still refuse; then: open that one sign-in in the system browser, or another fallback - not another disguise."
    blocks: [P5.1]
    default: keep fanout's own user agent; add a fallback only if the owner's sign-in still fails
  - id: D5
    title: Code signing
    status: open
    why: "Unsigned installers show a SmartScreen warning on Windows and are blocked by Gatekeeper on macOS until the user overrides. Certificates cost money (Windows OV/EV, Apple Developer 99 USD/yr)."
    blocks: [P4.4]
    default: ship unsigned first, like ContextWire

phases:
  - id: P0
    name: Foundation
    goal: Project skeleton, plan, watchtower.
    tasks:
      - id: P0.1
        title: Electron 45 project, ES modules, no runtime dependencies
        status: done
        effort: 1
        checks:
          - {type: path, path: package.json}
          - {type: path, path: node_modules/electron/dist}
      - id: P0.2
        title: roadmap.yaml + watchtower on port 8768
        status: done
        effort: 1
        checks:
          - {type: path, path: watchtower/server.py}
          - {type: cmd, run: "python -m unittest discover -s watchtower/tests -q"}
      - id: P0.3
        title: README, CLAUDE.md, docs (architecture, memory, gotchas, changelog), MIT licence
        status: done
        effort: 2
        checks:
          - {type: path, path: README.md}
          - {type: path, path: CLAUDE.md}
          - {type: path, path: LICENSE}
          - {type: path, path: docs/architecture.md}
          - {type: path, path: docs/memory.md}
          - {type: path, path: docs/gotchas.md}
          - {type: path, path: docs/changelog.md}
      - id: P0.4
        title: README with thedumbstuff's banner and screenshots of the real app; tools/screenshots.mjs (npm run screenshots) makes them from sample brands and folders and public signed-out pages, every page layer composed in
        status: done
        effort: 2
        why: "Owner asked 2026-11-13 for the README to look like ContextWire's, with fanout screenshots. Checked: the composed picture matches the system's own capture of the window (99.4% per 2x2 block) and is the same with the window covered. Five pictures, the media viewer's larger view (P2.11) among them. 2026-11-16 (owner, for fanout's page on thedumbstuff.page): Why opens with the real problem, the juggling (a browser or profile per brand, a pile of tabs, every site opened again each time); the post-for-you tools the owner looked at were expensive, charged by usage and bundled things like AI image and video generation; and fanout remembers each brand (signed in, same tabs, same pages side by side, the solo tab in front, the posted marks), as docs/architecture.md says it is saved. Same day (owner: 'Highlight saving system memory'): the sleeping-tabs line gives the rules (20 minutes, more than six loaded, both settable), the measured figures from docs/memory.md (317 / 2,724 / 1,036 MB, one PC, six front pages signed out), that a loaded page costs what the site makes it cost, and what the screenshots' status bar shows."
        checks:
          - {type: path, path: assets/thedumbstuff.jpg}
          - {type: path, path: tools/screenshots.mjs}
          - {type: cmd, run: 'node -e "const fs=require(`fs`);const missing=[...fs.readFileSync(`README.md`,`utf8`).matchAll(/src=.([^\x22]+)./g)].map((m)=>m[1]).filter((f)=>!fs.existsSync(f));console.log(missing.length?`missing: `+missing:`every picture README.md names exists`);process.exit(missing.length?1:0)"'}
          - {type: cmd, run: "node -e \"process.exit(require('./package.json').scripts.screenshots ? 0 : 1)\""}

  - id: P1
    name: Core
    goal: Brands with isolated sign-ins, tabs, and a jailed view of each brand's folder.
    tasks:
      - id: P1.1
        title: Saved data model (brands, tabs, settings) with repair on load, and an atomic JSON store
        status: done
        effort: 2
        checks:
          - {type: path, path: src/main/model.js}
          - {type: path, path: src/main/store.js}
          - {type: cmd, run: "npm test --silent"}
      - id: P1.2
        title: One browser session per brand (cookies, storage, cache), fanout's own user agent unchanged, permission prompts remembered per brand and site
        status: done
        effort: 3
        checks:
          - {type: path, path: src/main/sessions.js}
          - {type: cmd, run: "npm test --silent"}
      - id: P1.3
        title: Tab manager - lazy loading, one attached page, sign-in popups, links to new tabs, load errors, crashes
        status: done
        effort: 5
        depends_on: [P1.2]
        checks:
          - {type: path, path: src/main/tabs.js}
          - {type: path, path: src/main/pages.js}
      - id: P1.4
        title: Brand folder - one directory at a time, text preview capped at 512 KB, paths cannot leave the folder
        status: done
        effort: 3
        checks:
          - {type: path, path: src/main/files.js}
          - {type: path, path: src/main/pathjail.js}
      - id: P1.5
        title: Posted tracker - which file went to which tab, set by hand
        status: done
        effort: 2
        checks:
          - {type: path, path: src/main/posted.js}

  - id: P2
    name: Interface
    goal: Brand rail, tab strip, address bar, file panel, text preview, dialogs.
    tasks:
      - id: P2.1
        title: Window, preload bridge (fixed list of calls), application menu with all shortcuts
        status: done
        effort: 3
        depends_on: [P1.3]
        checks:
          - {type: path, path: src/main/main.js}
          - {type: path, path: src/main/ipc.js}
          - {type: path, path: src/main/menus.js}
          - {type: path, path: src/preload/preload.cjs}
      - id: P2.2
        title: Brand rail, tabs, toolbar, page placeholders, status bar with memory
        status: done
        effort: 4
        depends_on: [P2.1]
        checks:
          - {type: path, path: src/renderer/app.js}
          - {type: path, path: src/renderer/styles.css}
      - id: P2.3
        title: File panel - tree, multi-select, real file drag onto any page, posted marks, hide posted
        status: done
        effort: 4
        depends_on: [P1.4, P1.5, P2.1]
        checks:
          - {type: path, path: src/renderer/files.js}
          - {type: path, path: build/drag.png}
      - id: P2.4
        title: Text preview - click a .txt or .md file, select text and it is copied
        status: done
        effort: 2
        depends_on: [P2.3]
        checks:
          - {type: path, path: src/renderer/preview.js}
      - id: P2.5
        title: Brand dialog (name, colour, folder, starter tabs) and memory settings
        status: done
        effort: 2
        depends_on: [P2.2]
        checks:
          - {type: path, path: src/renderer/dialogs.js}
      - id: P2.7
        title: Split view - one to four pages side by side, resizable dividers, layout and open pages remembered per brand
        status: done
        effort: 4
        depends_on: [P2.2]
        why: Asked for by the owner mid-build (2026-11-12). Tabs on screen are never put to sleep.
        checks:
          - {type: cmd, run: "npm test --silent"}
      - id: P2.6
        title: End-to-end smoke test of the real app (93 checks, run by hand - it opens a window)
        status: done
        effort: 3
        depends_on: [P2.3, P2.4]
        checks:
          - {type: path, path: tools/smoke.mjs}
      - id: P2.8
        title: Tab names follow the page - a rename box left as it was saves nothing, a saved "New tab" name is repaired on load, a blank tab that loses its pane is removed
        status: done
        effort: 2
        depends_on: [P2.7]
        why: "Owner report 2026-11-12: a pane showing Instagram was labelled New tab in the strip and its header, and a blank New tab sat outside the group."
        checks:
          - {type: cmd, run: "npm test --silent"}
      - id: P2.9
        title: Markdown shown formatted in the preview, Source toggle, select-to-copy gives plain text; no pictures fetched, web links open as a new tab
        status: done
        effort: 3
        depends_on: [P2.4]
        why: "Owner asked 2026-11-12 for MD files shown properly, like ContextWire's Docs panel. Own small parser (markdown.js, pure), no library."
        checks:
          - {type: path, path: src/renderer/markdown.js}
          - {type: cmd, run: "npm test --silent"}

      - id: P2.10
        title: The group stays as arranged - a tab outside it opens on its own in front of it (remembered per brand), the tab menu puts a tab in the group or takes it out, closing a group tab leaves its pane empty (until 0.3.0, P2.12 - now the pane goes), Ctrl+Tab follows the tab strip
        status: done
        effort: 3
        depends_on: [P2.7, P2.8]
        why: "Owner report 2026-11-12: a new tab created outside the group went into the group and pushed a random group tab out. Selecting any tab put it in the focused pane. 37 unit tests and 65 smoke checks pass (2026-11-12)."
        checks:
          - {type: cmd, run: "npm test --silent"}

      - id: P2.11
        title: Media viewer - click a video, picture or sound to see it under the tree (size and shape, length, file size, own play/seek/volume controls, nothing autoplays), a larger view over the pages (Esc back, arrow keys step through the folder), a plain message and the default app for what cannot be shown
        status: done
        effort: 4
        depends_on: [P2.3, P2.4]
        why: "Owner asked 2026-11-13: 'We are dealing with media need to have viewer as well.' Files come over fanout-media: (interface session only, the file panel's jail, media kinds only, streamed in byte ranges, handle closed when the player stops). Formats checked on this PC with tools/media-formats.mjs (docs/architecture.md). 44 unit tests; 77 of 77 smoke checks in the last two runs (2026-11-13). The unsaved-typing check (simulated keys) failed in 4 of 6 runs that day, one of them with the media section skipped, so it is not caused by the viewer."
        checks:
          - {type: path, path: src/main/media.js}
          - {type: path, path: src/renderer/viewer.js}
          - {type: path, path: tools/media-formats.mjs}
          - {type: cmd, run: "npm test --silent"}

      - id: P2.12
        title: Drag tabs into a group (0.3.0) - onto another tab makes two side by side, onto the group adds it (four at most, a fifth refused and said why), inside the group moves it, out of it takes it out, onto an empty pane puts it there; a tab leaving the group takes its pane (dragged out, taken out, closed) and a group of one ends; Put in the group adds a pane before it replaces a tab
        status: done
        effort: 3
        depends_on: [P2.10]
        why: "Owner asked 2026-11-17: 'user drag the tab of browser to another tab make it the group, split into two. When a group has two and user drag another then 3 split into 3 similarly for 4'. The rules are plain functions in model.js (planDrop, dropTab, cleanDropTarget); the interface only works out what the pointer is over (renderer/tabdrag.js, targetAt) and asks the main process what a drop there does. Pointer events with capture on the strip, never an HTML drag (a unit test guards it; a press on a favicon did start a system drag in the smoke test, and it was stopped). Found on the way and fixed: after any change of the panes the pages sat at the old layout's rectangles, over a neighbour's pane, for 55 to 70 ms (measured); now 6 to 28 ms, the state is sent at once and the boxes reported as soon as they are rebuilt. 2026-11-17: 56 unit tests; smoke run 1: 92 of 93 (crowded-strip auto-scroll 0 px, cause not seen; the check now says whether the window was drawing), runs 2 and 3: 93 of 93, run 4 on the final code: 93 of 93; npm run measure 325 / 2,516 / 1,050 MB, as before. The drags in the smoke test are real pointer input sent to fanout's own interface; nobody has dragged with a real mouse yet."
        checks:
          - {type: path, path: src/renderer/tabdrag.js}
          - {type: cmd, run: "npm test --silent"}
          - {type: cmd, run: 'node -e "const fs=require(`fs`);const log=fs.readFileSync(`docs/changelog.md`,`utf8`);const ok=log.includes(`## 0.3.0`)&&/Drag a tab onto another tab/.test(log)&&/Drag a tab onto another/.test(fs.readFileSync(`README.md`,`utf8`));console.log(ok?`0.3.0 notes and the README say how to drag tabs into a group`:`the 0.3.0 notes or the README do not say it`);process.exit(ok?0:1)"'}
          - {type: cmd, run: 'node -e "const s=require(`fs`).readFileSync(`tools/smoke.mjs`,`utf8`);const ok=[`a tab dropped on another makes a group of two`,`a fifth tab is refused`,`a tab dropped on an empty pane`,`Escape cancels a drag`,`closing a tab of the group takes its pane away`].every((c)=>s.includes(c));console.log(ok?`the smoke test drags tabs`:`a drag check is missing from tools/smoke.mjs`);process.exit(ok?0:1)"'}

  - id: P3
    name: Memory
    goal: Tabs that are not in use cost nothing, and nothing is lost by saving memory.
    tasks:
      - id: P3.1
        title: Sleep policy - idle time and a cap on loaded tabs, least recently used first
        status: done
        effort: 3
        depends_on: [P1.3]
        checks:
          - {type: path, path: src/main/sleeper.js}
          - {type: cmd, run: "npm test --silent"}
      - id: P3.2
        title: Never sleep a tab that is uploading, playing sound, or holding unsaved typing
        status: done
        effort: 3
        depends_on: [P3.1]
        why: Upload detection looks only at request method and duration; unsaved work is the page's own beforeunload answer.
      - id: P3.3
        title: Memory measured on six real sites (2,724 MB loaded, 1,036 MB with five asleep)
        status: done
        effort: 2
        depends_on: [P3.1]
        checks:
          - {type: path, path: tools/measure-memory.mjs}
          - {type: path, path: docs/memory.md}
      - id: P3.4
        title: Close path that cannot hang (Electron 45 quit stalls after some sites)
        status: done
        effort: 2
        why: Save, flush cookies and site storage, then end the process. See docs/gotchas.md.

  - id: P4
    name: Packaging and release
    goal: Installers for Windows, macOS and Linux, downloadable from thedumbstuff.page.
    tasks:
      - id: P4.1
        title: App icon and Windows installer (NSIS, per user)
        status: done
        effort: 2
        checks:
          - {type: path, path: build/icon.png}
          - {type: path, path: dist/latest.yml}
      - id: P4.2
        title: macOS (.dmg) and Linux (AppImage, .deb) builds
        status: pending
        effort: 3
        why: "They can only be built on those systems: .github/workflows/build.yml builds all three on every push. The repository is public (https://github.com/thedumbstuff/fanout); its first run (on 9f6f567) succeeded with artifacts fanout-windows-latest, fanout-macos-latest and fanout-ubuntu-latest. Not tried on macOS or Linux (P5.3), and the site takes only fanout's Windows installer so far (thedumbstuff-site api/downloads.py has the rows for Linux and macOS written out, not switched on)."
        checks:
          - {type: path, path: .github/workflows/build.yml}
      - id: P4.3
        title: Downloads on thedumbstuff.page and a page for fanout
        status: done
        effort: 3
        depends_on: [P4.1]
        why: "Done 2026-11-17: fanout 0.2.0 is the first release on thedumbstuff.page. Built 2026-11-16 (thedumbstuff-site, its roadmap P9): the site's downloads service takes fanout (fanout-setup-<v>.exe and its .blockmap, no .sig) in parts (Cloudflare refuses requests over 100 MB), writes current/latest.yml itself (naming ../<v>/fanout-setup-<v>.exe, so the older blockmap resolves), current/fanout-setup.exe and release.json; tools/release.mjs publish uploads in 16 MB parts and resumes a cut-off run. Proved first against the site's preview: publish --yes resumed after 3 of 7 parts; electron-updater 6.8.11 downloaded 0.2.0 from the site's feed (SHA-512 passed) and, with 0.2.1 published too, fetched both blockmaps and only the 935 KB that changed. Then the owner deployed the site and node tools/release.mjs publish --yes published 0.2.0 (the build of 2026-11-13 20:44: the installer, 107.7 MB in 7 parts, and its .blockmap; the feed's releaseDate 2026-11-17T00:22:01Z). Seen live the same day: https://thedumbstuff.page/fanout/ answers; current/fanout-setup.exe answers with 112,898,811 bytes; latest.yml offers 0.2.0 with dist/latest.yml's SHA-512; python ../thedumbstuff-site/tools/check_download.py passed 22 of 22 (fanout's installer, size and SHA-256, feed SHA-512, versioned address, blockmap, and the buttons on its page). The README has the download line. That proof reads the live site and downloads every product's installer (about 200 MB), so it is not a check here: this watchtower re-runs checks every minute and must pass offline. Run it by hand; it is the site's P9.4 check. The check here is offline: the README's download link is the installer in the folder package.json's feed names (where installed copies update from), and it links fanout's page. Not seen yet: an installed fanout updating itself from the live feed (needs a second release); macOS and Linux (P4.2)."
        checks:
          - {type: cmd, run: 'node -e "const fs=require(`fs`);const feed=require(`./package.json`).build.publish[0].url;const r=fs.readFileSync(`README.md`,`utf8`);const ok=r.includes(`href=\x22${feed}fanout-setup.exe\x22`)&&r.includes(`href=\x22https://thedumbstuff.page/fanout/\x22`);console.log(ok?`README links ${feed}fanout-setup.exe and the fanout page`:`README has no download link into ${feed}`);process.exit(ok?0:1)"'}
      - id: P4.4
        title: Signed installers
        status: blocked
        effort: 2
        decision: D5
        why: Needs paid certificates; shipping unsigned first.
      - id: P4.5
        title: Automatic updates in the app (electron-updater) - download in the background, install on restart or on close, what is new
        status: done
        effort: 4
        why: "Proved on this PC 2026-11-12 with a local feed: an installed 0.2.0 became 0.2.1 both by closing the window and by Restart to update (docs/updates.md)."
        checks:
          - {type: path, path: src/main/updates.js}
          - {type: path, path: docs/updates.md}
          - {type: cmd, run: "npm test --silent"}
      - id: P4.6
        title: Release tool - build with notes from the changelog, local test feed, publish
        status: done
        effort: 2
        why: "publish uploads in 16 MB parts to the site's downloads service (resumable; a whole file already there is skipped; the site writes the feed), then publishes with that version's changelog notes. Works against the site's preview (2026-11-16) and the live site: it published 0.2.0 on 2026-11-17 (P4.3)."
        checks:
          - {type: path, path: tools/release.mjs}
          - {type: cmd, run: "npm test --silent"}

  - id: P5
    name: Proof with real accounts
    goal: The owner signs in and posts for real - the parts no test of mine can cover.
    tasks:
      - id: P5.1
        title: Sign in to YouTube (Google), LinkedIn, TikTok, Instagram, Facebook, X inside fanout
        status: in_progress
        effort: 2
        why: "YouTube (Google): works, confirmed by the owner's own sign-in on 2026-11-16 (Google had refused on 2026-11-12 while fanout claimed to be Chrome; the true user agent fixed it, D4). The others: the front pages of all six load, and the TikTok, Instagram and Facebook sign-in pages load (2026-11-12), but nobody has reported a completed sign-in on LinkedIn, TikTok, Instagram, Facebook or X yet. Done when the owner has signed in on each."
      - id: P5.2
        title: Drag a real video from the file panel onto a real upload page and post it
        status: pending
        effort: 1
        depends_on: [P5.1]
        why: "The drag is a native OS file drag (the same call Explorer makes), verified only up to starting it. The drop needs a person and a signed-in upload page."
      - id: P5.3
        title: Use on macOS and Linux
        status: pending
        effort: 2
        depends_on: [P4.2]
        why: Written to be cross-platform, run only on Windows 11 so far.

  - id: P6
    name: Later
    goal: Agreed or likely next steps, not part of the first version.
    tasks:
      - id: P6.1
        title: Caption clipboard - write title, caption and hashtags once per post, copy buttons, user pastes
        status: pending
        effort: 3
        why: Owner said "caption later" (2026-11-12). The tool still never types into a page.
      - id: P6.2
        title: Thumbnails of videos and pictures in the file tree
        status: pending
        effort: 3
        depends_on: [P2.11]
        why: "The look at one file at a time is done (P2.11, the media viewer). Thumbnails are a separate decision: a picture per row means decoding many files, which needs its own memory bound (and a cache) first."
      - id: P6.3
        title: Reorder tabs and brands by dragging
        status: pending
        effort: 2
        why: "Tabs of the group move by dragging since 0.3.0 (P2.12). Tabs outside the group and the brands in the rail do not: a tab dropped on another outside the group is not a drop, because a brand keeps one group."
      - id: P6.4
        title: Find in page
        status: pending
        effort: 1
      - id: P6.5
        title: Posted marks follow a file that is renamed or moved inside the folder
        status: pending
        effort: 2

features:
  - {id: F1, title: Brands with their own sign-ins, source: own, area: sessions, status: shipped, task: P1.2, note: "Each brand is a separate cookie jar; the same site can be signed in differently in every brand"}
  - {id: F2, title: Tabs per brand, source: own, area: workspace, status: shipped, task: P1.3, note: "Any address; nothing is specific to a platform"}
